# Observatorio de actividad sísmica · Docker Compose
# Fase 3: Kafka + creación de topics + productor de prueba + consumidor mínimo.
# Fase 5: + productor real (USGS cada 60 s). Falta la API.
# Base: configuración KRaft de juanarrow/binance-kafka (docker.md explica cada variable),
# adaptada a los requisitos del enunciado §9: volumen persistente y retención limitada.

name: observatorio-sismico

services:
  kafka:
    image: apache/kafka:4.1.2          # misma imagen que el ejemplo del profesor
    hostname: kafka                    # nombre con el que lo encuentran los demás contenedores
    environment:
      # --- Un único nodo que es a la vez broker (guarda mensajes) y controller (guarda metadatos). Sin ZooKeeper (modo KRaft).
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw   # id fijo: con volumen persistente, cada arranque reconoce el mismo clúster

      # --- Listeners (por dónde escucha):
      #   PLAINTEXT :9092 -> para productor y consumidor, dentro de la red de Docker (kafka:9092)
      #   CONTROLLER :9093 -> uso interno de Kafka
      # Kafka NO se publica al host ni al túnel (enunciado §2 y §9).
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      # --- Un solo broker: los topics internos no pueden tener 3 réplicas (valor por defecto)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0

      # --- Topics: se crean a mano (no automáticamente) para que un nombre mal escrito no cree un topic nuevo sin avisar
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"

      # --- Retención LIMITADA (enunciado §9): los mensajes se borran a los 7 días
      #     o cuando una partición supera 512 MB, lo que ocurra antes.
      KAFKA_LOG_RETENTION_HOURS: 168
      KAFKA_LOG_RETENTION_BYTES: 536870912

      # --- Dónde guarda los datos dentro del contenedor (montado en un volumen persistente, abajo)
      KAFKA_LOG_DIRS: /var/lib/kafka/data
    volumes:
      - kafka-data:/var/lib/kafka/data   # los mensajes sobreviven a "docker compose down"
    healthcheck:                         # Compose considera Kafka "sano" cuando responde a esta orden
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 5s
      timeout: 10s
      retries: 24
      start_period: 25s
    restart: unless-stopped

  # Crea los topics y TERMINA. Como la creación automática está desactivada, los topics se declaran aquí.
  # --if-not-exists: si ya existen (en el volumen), no da error -> se puede ejecutar en cada arranque.
  kafka-init:
    image: apache/kafka:4.1.2
    depends_on:
      kafka:
        condition: service_healthy       # esperar a que Kafka esté sano, no solo arrancado
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        for t in terremotos.live terremotos.replay; do
          /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --create --if-not-exists \
            --topic "$$t" --partitions 3 --replication-factor 1
        done
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092 --list
    restart: "no"

  # Consumidor (versión mínima): lee terremotos.live y muestra cada mensaje en su log.
  consumidor:
    build: ./backend                     # imagen Python común (backend/Dockerfile)
    image: observatorio-backend          # mismo nombre en todos los servicios Python -> una sola imagen
    command: ["python", "-m", "src.consumidor"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092   # nombre del servicio, NO localhost (FAQ 28)
      KAFKA_TOPIC: terremotos.live
      KAFKA_GROUP_ID: consumidor-observatorio
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    depends_on:
      kafka-init:
        condition: service_completed_successfully   # no arrancar hasta que existan los topics
      postgres:
        condition: service_healthy                  # ni hasta que PostgreSQL acepte conexiones
    restart: unless-stopped

  # Productor REAL: consulta USGS cada 60 s y publica solo novedades (src/productor.py)
  productor:
    build: ./backend
    image: observatorio-backend
    command: ["python", "-m", "src.productor"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: terremotos.live
      USGS_FEED_URL: https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/all_day.geojson
      INTERVALO_S: 60          # frecuencia de consulta (enunciado §4.1)
      HTTP_TIMEOUT_S: 20
      RAW_DIR: /data/raw
      RAW_RETENCION_H: 24      # los originales se borran a las 24 h
      POSTGRES_HOST: postgres
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./data/raw:/data/raw   # originales visibles en el equipo (carpeta excluida de Git)
    depends_on:
      kafka-init:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
    healthcheck:               # "sano" si ha completado un ciclo en los últimos 3 minutos
      test: ["CMD", "python", "-c", "import os,time,sys; sys.exit(0 if time.time()-os.path.getmtime('/tmp/latido')<180 else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 90s
    restart: unless-stopped

  # Productor de PRUEBA: envía 1 terremoto de ejemplo y termina.
  # Tiene "profile", así que NO arranca con "docker compose up": se lanza a mano con
  #   docker compose run --rm productor-prueba
  productor-prueba:
    build: ./backend
    image: observatorio-backend
    command: ["python", "-m", "src.productor_prueba"]
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: terremotos.live
    depends_on:
      kafka-init:
        condition: service_completed_successfully
    profiles: ["pruebas"]
    restart: "no"

  # Base de datos. Las variables ${...} se leen del archivo .env (que NO se sube a Git).
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - pg-data:/var/lib/postgresql/data          # datos persistentes
      - ./sql:/docker-entrypoint-initdb.d:ro      # scripts que crean las tablas la PRIMERA vez (solo lectura)
    healthcheck:                                  # "sano" cuando acepta conexiones
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    # Sin "ports": PostgreSQL NO se publica fuera de Docker (enunciado §9)

volumes:
  kafka-data:
  pg-data:
