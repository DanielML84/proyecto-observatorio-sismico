<!-- #nombre crea una referencia al elemento para pasárselo a enviar(). novalidate: validamos nosotros, en español. -->
<form #formulario class="filtros" aria-label="Filtros de la consulta" novalidate
      (submit)="enviar($event, inicio, fin, magnitud, pais)">

  <!-- Cada campo con su label asociado (for + id): así lo anuncia un lector de pantalla. -->
  <div class="campo">
    <label for="filtro-inicio">Inicio (UTC)</label>
    <input #inicio id="filtro-inicio" type="datetime-local">
  </div>

  <div class="campo">
    <label for="filtro-fin">Fin (UTC)</label>
    <input #fin id="filtro-fin" type="datetime-local">
  </div>

  <div class="campo">
    <label for="filtro-magnitud">Magnitud mínima</label>
    <input #magnitud id="filtro-magnitud" type="number" step="0.1" inputmode="decimal">
  </div>

  <div class="campo">
    <label for="filtro-pais">País</label>
    <select #pais id="filtro-pais">
      <option value="" [selected]="!aplicados().country_id">Todos los países</option>
      <!-- Lista fija, del catálogo: no cambia con los filtros. track identifica cada opción por su código. -->
      @for (p of paises(); track p.id) {
        <option [value]="p.id" [selected]="p.id === aplicados().country_id">{{ p.nombre }}</option>
      }
    </select>
  </div>

  <div class="botones">
    <button type="submit">Aplicar</button>
    <button type="button" class="secundario" (click)="limpiar(formulario)">Limpiar</button>
    <span class="cargando" aria-live="polite">{{ cargando() ? 'Actualizando…' : '' }}</span>
  </div>

  @if (error(); as mensaje) {
    <p class="error" role="alert">{{ mensaje }}</p>
  }

  <p class="ayuda">
    Inicio incluido y fin excluido. Sin fechas: últimas 24 h. Solo con fin: las 24 h anteriores.
    Solo con inicio: hasta ahora. Los eventos sin magnitud no cumplen el filtro de magnitud mínima.
  </p>
</form>
